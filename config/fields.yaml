# Generated from TX_Surface_Fields_and_Rules.xlsx by `titlepilot import-config`.
# Edit the workbook, not this file, except for 'enabled' and 'params'.
fields:
- name: instrument_id
  group: core
  type: text
  description: County + volume/page or Official Public Records instrument number
  required: true
- name: instrument_type
  group: core
  type: text
  description: The instrument's title as written on it, one value only (e.g. Warranty Deed, Gift Deed, Deed of Trust, Release of Lien, Road Easement, UCC Financing Statement, Correction Affidavit). Do not answer 'other'.
  required: false
- name: county
  group: core
  type: text
  description: County of recording
  required: false
- name: volume
  group: core
  type: text
  description: Recording reference as stamped
  required: false
- name: page
  group: core
  type: text
  description: Recording reference as stamped
  required: false
- name: instrument_no
  group: core
  type: text
  description: Recording reference as stamped
  required: false
- name: execution_date
  group: core
  type: date
  description: Value as YYYY-MM-DD; source_text as written. Filing date is the clerk's filed or recorded stamp.
  required: false
- name: filing_date
  group: core
  type: date
  description: Value as YYYY-MM-DD; source_text as written. Filing date is the clerk's filed or recorded stamp.
  required: false
- name: grantors
  group: core
  type: list of parties
  description: Name as written, marital status, spouse, capacity (individual, executor, trustee, agent, corporate officer)
  required: false
- name: grantees
  group: core
  type: list of parties
  description: Same fields as grantors
  required: false
- name: legal_description_text
  group: core
  type: text

  required: false
- name: restrictions
  group: surface
  type: text
  description: Deed restrictions, covenants and plat notes, verbatim
  required: false
- name: liens
  group: surface
  type: list
  description: Deed of trust, vendor's lien, judgment, tax or mechanic's lien, with holder, amount and release reference
  required: false
- name: plat_reference
  group: surface
  type: text
  description: Subdivision, lot, block, plat cabinet and slide
  required: false
- name: possession_notes
  group: surface

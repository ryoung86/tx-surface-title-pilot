  required: false
- name: conveyance_type
  group: surface
  type: text
  description: 'For deeds: warranty, special warranty, without warranty, quitclaim, gift, tax deed or sheriff''s deed. Empty for other instruments.'
  required: false
- name: surface_interest
  group: surface
  type: text
  description: 'Interest conveyed, as written: all, fee simple, an undivided fraction or percent (e.g. ''undivided 5% of the surface only''), life estate or remainder'
  required: false
- name: mineral_exception
  group: surface
  type: text
  description: Any minerals excepted or reserved from the conveyance, verbatim
  required: false
- name: term
  group: surface
  type: text
  description: "The term of a lease, easement or timber deed as written: primary term, renewals, extensions and options (e.g. 'thirty (30) years ... two renewal terms of five (5) years each'). Empty if none stated"
  required: false
- name: pore_space
  group: surface
  type: text
  description: "Any language about pore space, subsurface or underground storage space, geologic storage, storage reservoirs or salt caverns, or carbon dioxide (CO2) injection, storage or sequestration rights: grants, reservations, exceptions, leases, easements or options. Verbatim. Empty if none. A plain mineral reservation ('oil, gas and other minerals') is not pore space language: leave it in mineral_exception only"
  required: false
- name: homestead_indicators
  group: surface
  type: text
  description: Homestead designation, spouse joinder or recitals
  required: false
- name: easements
  group: surface
  type: list

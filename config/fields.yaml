  required: false
- name: survey_name
  group: core
  type: text
  description: Parsed when present
  required: false
- name: abstract_no
  group: core
  type: text
  description: Parsed when present
  required: false
- name: block
  group: core
  type: text
  description: Parsed when present
  required: false
- name: section
  group: core
  type: text
  description: Parsed when present
  required: false
- name: acreage
  group: core
  type: number
  description: Acreage conveyed or covered by this instrument, as a number (e.g. 5.60)
  required: false
- name: less_and_except
  group: core
  type: text
  description: Any exclusions, verbatim
  required: false
- name: refers_to
  group: core
  type: list
  description: Prior instruments cited (amends, releases, ratifies, corrects)
  required: false
- name: consideration
  group: core
  type: text
